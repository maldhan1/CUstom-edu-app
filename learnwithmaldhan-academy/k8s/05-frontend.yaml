apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: maldhan-academy
spec:
  replicas: 2
  selector:
    matchLabels: {app: academy-frontend}
  template:
    metadata:
      labels: {app: academy-frontend}
    spec:
      containers:
      - name: frontend
        image: maldhan/learnwithmaldhan-frontend:v1
        imagePullPolicy: Always
        ports: [{name: http, containerPort: 80}]
        readinessProbe:
          httpGet: {path: /, port: 80}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /, port: 80}
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {cpu: 300m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: maldhan-academy
spec:
  type: LoadBalancer
  selector: {app: academy-frontend}
  ports: [{name: http, port: 80, targetPort: 80}]
